# ---------------------------------------------------------------------
# Clack como contenedor, para el caso en que Caddy también esté en Docker.
# ---------------------------------------------------------------------
# IMPORTANTE: esto NO reemplaza el docker-compose de n8n. Es un archivo
# aparte que solo levanta Clack y lo engancha a la MISMA red de n8n, para
# que Caddy pueda encontrarlo por su nombre.
#
#   docker compose -f despliegue/docker-compose.clack.yml up -d
#
# Cambia "nombre_de_la_red_de_n8n" por la red real. Para verla:
#   docker network ls
# ---------------------------------------------------------------------

services:
  clack:
    build:
      context: ..
      dockerfile: despliegue/Dockerfile
    container_name: clack
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
    # Ojo: NO se publican puertos hacia afuera (nada de "ports:").
    # Solo Caddy, desde la red interna, puede hablar con Clack.
    networks:
      - red_del_proxy

networks:
  red_del_proxy:
    external: true
    name: nombre_de_la_red_de_n8n
